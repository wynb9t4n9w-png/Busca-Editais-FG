<style>
/* ===========================================================================
   BUSCA EDITAIS FG — sistema visual Thutor, o mesmo da Pauta Thutor.
   Chrome teal #00798A. Cada frente do institucional 2025 tem seu matiz.
   =========================================================================== */
:root{
  --teal:#00798a; --teal-dk:#005e6c; --teal-mid:#66afb9; --teal-lt:#a2ced4; --teal-xlt:#cde4e8;
  --gray:#bfbfbf; --gray-lt:#e6e8ea;
  --ink:#1b2430; --mut:#5c6a76; --line:#e1e7ea; --bg:#f5f8f9; --card:#fff;
  --quente:#ce5347; --quente-i:#a8403a; --quente-l:#faedeb;
  --morno:#c68a12;  --morno-i:#8f6410;  --morno-l:#faf2e0;
  --frio:#7d8a95;   --frio-i:#5c6a76;   --frio-l:#eef1f3;
  --ok:#327a5b; --erro:#a8403a;
  --f-cultura:#3e9c74; --f-estrategia:#3c63ae; --f-lideranca:#c68a12;
  --f-eficiencia:#00798a; --f-governanca:#7a4fa3; --f-pessoas:#ce5347;
  --r:999px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);line-height:1.55;font-size:clamp(16px,0.93rem + 0.22vw,18.5px);
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
  font-family:'Source Sans 3','Source Sans Pro','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}
a{color:var(--teal)}
h1,h3,h4{margin:0 0 .4em;line-height:1.18;font-weight:700;letter-spacing:-.015em}
h1{font-size:clamp(1.5rem,1.15rem + 1.7vw,2rem);color:var(--teal)}
h3{font-size:1.02rem;margin-top:0;color:var(--ink)}
h4{font-size:.9rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 .8em}
small,.small{font-size:.84rem;color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(20px,2.2vw,34px) clamp(16px,2.6vw,32px) 90px}

h2{position:relative;margin:0 0 18px;font-size:0;line-height:0}
h2 .t{
  position:relative;z-index:3;margin-right:64px;min-height:46px;
  background:var(--teal);color:#fff;border-radius:var(--r);
  display:flex;align-items:center;padding:9px 24px;
  font-size:clamp(1rem,.9rem + .5vw,1.18rem);font-weight:700;line-height:1.25;letter-spacing:-.01em;
}
h2::before{content:'';position:absolute;inset:0 32px 0 0;z-index:2;background:var(--teal-mid);border-radius:var(--r)}
h2::after{content:'';position:absolute;inset:0;z-index:1;background:var(--teal-lt);border-radius:var(--r)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:clamp(18px,1.7vw,28px);margin-bottom:20px;box-shadow:0 1px 3px rgba(0,60,70,.05);
}
.topbar{
  background:var(--teal);color:#fff;padding:clamp(11px,1.1vw,16px) clamp(16px,2.6vw,32px);
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
}
.topbar .marca{display:flex;align-items:center;gap:14px}
.topbar img{height:clamp(24px,2.1vw,34px);width:auto;display:block}
.topbar .sub{font-size:.82rem;opacity:.85;font-weight:600}
.topbar nav{display:flex;gap:6px;flex-wrap:wrap}
.topbar nav button{
  color:#fff;background:none;border:0;font:inherit;font-size:.84rem;font-weight:700;
  padding:7px 15px;border-radius:var(--r);opacity:.78;cursor:pointer;min-height:auto;
}
.topbar nav button:hover{opacity:1;background:rgba(255,255,255,.13)}
.topbar nav button[aria-selected="true"]{background:#fff;color:var(--teal);opacity:1}
.topbar nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}

button,.btn-a{
  font:inherit;cursor:pointer;border:0;border-radius:var(--r);
  padding:11px 24px;font-weight:700;transition:.15s;text-decoration:none;
  display:inline-block;text-align:center;min-height:44px;-webkit-tap-highlight-color:transparent;
}
.btn{background:var(--teal);color:#fff}
.btn:hover{background:var(--teal-dk)}
.btn:disabled{background:var(--gray);cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal-lt)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-sm{padding:7px 16px;font-size:.85rem;min-height:auto}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

input[type=text],input[type=search],input[type=password],select,textarea{
  font:inherit;font-size:max(16px,1rem);padding:11px 16px;min-height:46px;
  border:1px solid var(--line);border-radius:var(--r);width:100%;background:#fff;color:var(--ink);
}
textarea{border-radius:16px;resize:vertical;font-size:.92rem;min-height:66px}
select{border-radius:var(--r);appearance:none;padding-right:38px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235c6a76' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;background-size:16px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:5px}

.hint{background:var(--teal-xlt);border-left:4px solid var(--teal);padding:12px 16px;border-radius:0 14px 14px 0;font-size:.9rem;margin-bottom:16px}
.warn{background:var(--morno-l);border-left:4px solid var(--morno);padding:12px 16px;border-radius:0 14px 14px 0;font-size:.9rem;margin-bottom:16px}
.vazio{text-align:center;padding:44px 20px;color:var(--mut)}
.vazio b{display:block;font-size:1.1rem;color:var(--ink);margin-bottom:6px}

/* painel de números */
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(9px,.9vw,14px);margin-bottom:20px}
@media (max-width:820px){.qgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,1.1vw,18px) clamp(14px,1.3vw,20px)}
.stat b{display:block;font-size:clamp(1.5rem,1.3rem + .7vw,2.15rem);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--teal)}
.stat b i{font-style:normal;font-size:.95rem;font-weight:600;color:var(--mut)}
.stat span{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.stat.s-quente b{color:var(--quente)}
.stat.s-morno b{color:var(--morno)}
.stat.s-prazo b{color:var(--f-governanca)}

/* o edital */
.edital{border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;background:var(--card);border-left:5px solid var(--frio)}
.edital.v-quente{border-left-color:var(--quente)}
.edital.v-morno{border-left-color:var(--morno)}
.edital.encerrado{opacity:.55}
.ed-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.ed-orgao{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.045em;color:var(--mut);line-height:1.35}
.ed-objeto{font-size:1.01rem;font-weight:600;line-height:1.42;margin:2px 0 8px;color:var(--ink)}
.ed-just{font-size:.92rem;color:var(--mut);margin-bottom:10px;font-style:italic;line-height:1.5}
.ed-meta{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--mut)}
.ed-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ed-rodape{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}

.tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.055em;padding:4px 11px;border-radius:var(--r);white-space:nowrap}
.tag.quente{background:var(--quente-l);color:var(--quente-i)}
.tag.morno{background:var(--morno-l);color:var(--morno-i)}
.tag.frio{background:var(--frio-l);color:var(--frio-i)}
.fr{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:var(--r);color:#fff;white-space:nowrap}
.fr.cultura{background:var(--f-cultura)} .fr.estrategia{background:var(--f-estrategia)}
.fr.lideranca{background:var(--f-lideranca)} .fr.eficiencia{background:var(--f-eficiencia)}
.fr.governanca{background:var(--f-governanca)} .fr.pessoas{background:var(--f-pessoas)}
.prazo{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.prazo.urg{color:var(--quente-i)} .prazo.perto{color:var(--morno-i)} .prazo.fim{color:var(--mut);text-decoration:line-through}
.dp{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:var(--r);
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border:1.5px solid}
.dp.aberto{background:var(--ok-l,#e8f4ef);color:#327a5b;border-color:#327a5b}
.dp.indeterminado{background:var(--morno-l);color:var(--morno-i);border-color:var(--morno)}
.dp.decidido{background:var(--frio-l);color:var(--frio-i);border-color:var(--frio)}
.dp.relicita{background:var(--teal-xlt);color:var(--teal-dk);border-color:var(--teal)}
.dp.cancelado{background:var(--frio-l);color:var(--frio-i);border-color:var(--frio)}
.dp.encerrado{background:var(--frio-l);color:var(--frio-i);border-color:var(--frio)}
.venceu{background:var(--frio-l);border-left:4px solid var(--frio);border-radius:0 12px 12px 0;
  padding:9px 14px;margin-top:11px;font-size:.88rem}
.venceu b{color:var(--ink)}
.st{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 11px;border-radius:var(--r);background:var(--gray-lt);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.st.participando,.st.proposta{background:var(--teal-xlt);color:var(--teal-dk)}
.st.ganho{background:#e8f4ef;color:var(--ok)}
.st.descartado,.st.perdido{background:var(--frio-l);color:var(--frio-i)}

.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filtros select,.filtros input{width:auto;min-width:150px;flex:0 1 auto}
.filtros input[type=search]{flex:1 1 240px}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:800;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}

.portao{max-width:430px;margin:36px auto;text-align:center}
.portao .cad{width:56px;height:56px;margin:0 auto 16px;color:var(--teal-lt)}
.portao svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
.portao .campos{text-align:left;margin-top:22px}
.erro{color:var(--erro);font-size:.9rem;font-weight:700;margin-top:10px;min-height:1.3em}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 40px));background:var(--ink);color:#fff;
  padding:13px 26px;border-radius:var(--r);font-size:.92rem;font-weight:600;z-index:60;transition:transform .28s;
  max-width:min(90vw,520px);text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.22)}
#toast.on{transform:translate(-50%,0)}
</style>

<script>
(function(){
"use strict";

/* O HTML original, antes de qualquer render. É a base para republicar: o
   estado vive dentro da própria página, e salvar significa reescrever o miolo
   entre /*DADOS*/ /*e*/ /*FIM*/ /*e publicar o arquivo inteiro de novo. */
var estado;
try { estado = JSON.parse(document.getElementById("dados").textContent.replace(/^\/\*DADOS\*\//,"").replace(/\/\*FIM\*\/$/,"")); }
catch(e){ estado = {versao:1, editais:[], rodadas:[]}; }
estado.editais = estado.editais || [];
estado.rodadas = estado.rodadas || [];

/* O acompanhamento comercial NÃO vive nesta página. Ele vive no banco do
   artifact, e chega aqui pela assinatura do PASSO de partida. Consequência que
   vale registrar: a rotina das 02:00 reescreve este HTML inteiro todo dia e,
   estruturalmente, não tem como encostar em status ou nota. Antes isso era uma
   instrução no prompt da rotina — instrução se esquece; arquitetura, não. */
var db = null, podeEscrever = true, acomp = {}, dbPronto = false, dbErro = null;

function statusDe(e){ return (acomp[e.id] && acomp[e.id].status) || "novo"; }
function notaDe(e){ return (acomp[e.id] && acomp[e.id].nota) || ""; }

var FRENTES = {
  cultura:"Cultura", estrategia:"Estratégia", lideranca:"Liderança",
  eficiencia:"Eficiência", governanca:"Governança", pessoas:"Pessoas"
};
/* Ainda dá para disputar? A pergunta que o radar não fazia — e por não fazer,
   exibiu como "super oportunidade" um contrato de R$ 1,5 mi que o CRECI/SC já
   havia assinado com a UFSC na véspera da publicação do extrato.

   Desde 06/09/2026 só estes três estados chegam à página: o que não é
   disputável sai na varredura. "relicita" ganhou rótulo aqui porque não tinha —
   um edital deserto ou fracassado renderizava a palavra "undefined" no lugar da
   etiqueta, e é justamente o caso mais valioso do radar: o órgão quis comprar,
   não conseguiu, e costuma voltar. */
var DISPUTA = {
  aberto:        "prazo aberto",
  indeterminado: "sem prazo declarado",
  relicita:      "deve relicitar"
};
function rotuloDisputa(e){ return DISPUTA[disputaDe(e)] || disputaDe(e); }
function disputaDe(e){ return e.disputa || "indeterminado"; }
function disputavel(e){
  var d = disputaDe(e);
  return d === "aberto" || d === "indeterminado" || d === "relicita";
}

var STATUS = {
  novo:"Novo", analisando:"Analisando", proposta:"Proposta enviada",
  participando:"Participando", ganho:"Ganho", perdido:"Perdido", descartado:"Descartado"
};

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function el(id){ return document.getElementById(id); }
/* Painel que pode não existir. A versão pública é gerada removendo a aba
   Acompanhamento, e foi exatamente assim que a Pauta Thutor quebrou: um el()
   virou null, a função estourou no meio e as outras abas abriram vazias.
   Aqui a ausência é um caso previsto, não um acidente. */
function elOpcional(id){ return document.getElementById(id); }
function visivel(id){ var n = elOpcional(id); return !!n && !n.hidden; }
function toast(msg){ var t=el("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); }, 4200); }

function hoje(){
  /* A data de referência é sempre São Paulo: um edital que encerra "amanhã"
     precisa dizer o mesmo para quem abre a página em qualquer fuso. */
  var f = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"});
  return f.format(new Date());
}
function br(iso){ return iso ? String(iso).slice(0,10).split("-").reverse().join("/") : "—"; }
function dinheiro(v){
  if(!v) return "sigiloso";
  if(v >= 1e6) return "R$ " + (v/1e6).toFixed(v>=1e7?0:1).replace(".",",") + " mi";
  return "R$ " + Math.round(v).toLocaleString("pt-BR");
}
function diasAte(iso){
  if(!iso) return null;
  var a = new Date(hoje()+"T00:00:00"), b = new Date(String(iso).slice(0,10)+"T00:00:00");
  if(isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
function classePrazo(d){ return d===null?"":(d<0?"fim":(d<=3?"urg":(d<=7?"perto":""))); }
function textoPrazo(d){
  if(d===null) return "sem prazo";
  if(d<0) return "encerrado";
  if(d===0) return "encerra hoje";
  if(d===1) return "1 dia";
  return d + " dias";
}
function aberto(e){ var d=diasAte(e.encerramento); return d===null || d>=0; }

function resumo(txt, n){
  txt = String(txt||"").trim();
  if(txt.length <= n) return txt;
  /* Corta na fronteira de palavra mais proxima para nao terminar no meio de
     uma sigla ou de um numero de norma. */
  var corte = txt.lastIndexOf(" ", n);
  return txt.slice(0, corte > n*0.7 ? corte : n).replace(/[ ,;.-]+$/, "") + "…";
}

function tagsFrentes(e){
  return (e.frentes||[]).map(function(f){
    return '<span class="fr '+esc(f)+'">'+esc(FRENTES[f]||f)+'</span>';
  }).join(" ");
}

function cartao(e, comStatus){
  var d = diasAte(e.encerramento);
  var local = [e.municipio, e.uf].filter(Boolean).join(" · ");
  return '<article class="edital v-'+esc(e.veredito||"frio")+(d!==null&&d<0?" encerrado":"")+'">'+
    '<div class="ed-topo">'+
      '<div style="flex:1 1 340px">'+
        '<div class="ed-orgao">'+esc(e.orgao||"")+(local?' — '+esc(local):'')+'</div>'+
        '<div class="ed-objeto">'+esc(resumo(e.objeto, 340))+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
        '<span class="tag '+esc(e.veredito||"frio")+'">'+esc(e.veredito||"frio")+'</span>'+
        '<span class="dp '+esc(disputaDe(e))+'">'+esc(rotuloDisputa(e))+'</span>'+
        (comStatus && statusDe(e)!=="novo" ? '<span class="st '+esc(statusDe(e))+'">'+esc(STATUS[statusDe(e)]||statusDe(e))+'</span>' : '')+
      '</div>'+
    '</div>'+
    (e.justificativa ? '<div class="ed-just">'+esc(e.justificativa)+'</div>' : '')+
    '<div class="ed-meta">'+
      '<span><b>'+esc(dinheiro(e.valor))+'</b></span>'+
      '<span>'+esc(e.modalidade||"—")+'</span>'+
      '<span>publicado '+esc(br(e.publicado_em))+'</span>'+
      '<span class="prazo '+classePrazo(d)+'">'+esc(textoPrazo(d))+
        (d!==null&&d>=0&&e.encerramento?' · '+esc(br(e.encerramento)):'')+'</span>'+
    '</div>'+
    '<div class="ed-rodape">'+
      tagsFrentes(e)+
      '<a class="btn-a btn-ghost btn-sm" href="'+esc(e.link)+'" target="_blank" rel="noopener">Abrir edital</a>'+
      '<span class="small mono" style="margin-left:auto">'+esc(e.fonte||"")+'</span>'+
    '</div>'+
    (!e.vencedor && e.documento_fecho
      ? '<div class="venceu">O processo já tem documento de fecho anexado: <b>'+
        esc(e.documento_fecho)+'</b></div>' : '')+
    (e.tambem_publicado_como && e.tambem_publicado_como.length
      ? '<div class="venceu">Mesma disputa publicada também em '+
        e.tambem_publicado_como.map(function(u){
          return '<a href="'+esc(u)+'" target="_blank" rel="noopener">outro registro</a>';
        }).join(", ")+' — é um certame só, não mande proposta em duplicidade.</div>'
      : '')+
    (e.vencedor
      ? '<div class="venceu">Contratado: <b>'+esc(e.vencedor.fornecedor||"—")+'</b>'+
        (e.vencedor.valor ? ' por '+esc(dinheiro(e.vencedor.valor)) : '')+
        (e.vencedor.assinado_em ? ', assinado em '+esc(br(e.vencedor.assinado_em)) : '')+'.</div>'
      : '')+
    (comStatus && notaDe(e) ? '<div class="small" style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)"><b>Nota:</b> '+esc(notaDe(e))+'</div>' : '')+
  '</article>';
}

/* ---------- RADAR ---------- */
function renderRadar(){
  var abertos = estado.editais.filter(function(e){
    var st = statusDe(e);
    return disputavel(e) && aberto(e) && st!=="descartado" && st!=="perdido";
  });
  var quentes = abertos.filter(function(e){ return e.veredito==="quente"; });
  var mornos  = abertos.filter(function(e){ return e.veredito==="morno"; });
  /* Só quente e morno: um frio que fecha amanhã não é urgência, é um frio. */
  var urgentes = quentes.concat(mornos).filter(function(e){
    var d=diasAte(e.encerramento); return d!==null && d>=0 && d<=7; });
  var soma = quentes.concat(mornos).reduce(function(a,e){ return a + (e.valor||0); }, 0);

  function ordena(a,b){
    var da=diasAte(a.encerramento), db=diasAte(b.encerramento);
    if(da===null) da=9999; if(db===null) db=9999;
    if(da!==db) return da-db;
    return (b.score||0)-(a.score||0);
  }
  quentes.sort(ordena); mornos.sort(ordena);

  var r = (estado.rodadas||[])[0] || {};

  /* O que fecha em três dias é ação de hoje, não item de lista. Medido em
     06/09/2026: quatro dos treze quentes e mornos encerravam em três dias, e o
     radar os mostrava misturados aos que fecham em quarenta. O contador "fecham
     em 7 dias" não servia: ele soma frios, e um frio urgente é só um frio. */
  var correndo = quentes.concat(mornos).filter(function(e){
    var d = diasAte(e.encerramento); return d !== null && d >= 0 && d <= 3;
  }).sort(function(a,b){ return diasAte(a.encerramento)-diasAte(b.encerramento); });

  var corpo =
    '<h2><span class="t">Radar de oportunidades</span></h2>'+
    '<div class="qgrid">'+
      '<div class="stat s-quente"><b>'+quentes.length+'</b><span>Quentes</span></div>'+
      '<div class="stat s-morno"><b>'+mornos.length+'</b><span>Mornos</span></div>'+
      '<div class="stat s-prazo"><b>'+urgentes.length+'</b><span>Quentes/mornos em 7 dias</span></div>'+
      '<div class="stat"><b>'+esc(dinheiro(soma))+'</b><span>Valor em jogo</span></div>'+
      '<div class="stat"><b>'+abertos.filter(function(e){ return !e.encerramento; }).length+
        '</b><span>Sem prazo declarado</span></div>'+
    '</div>';

  if(correndo.length){
    corpo += '<div class="warn"><b>Fecha'+(correndo.length>1?'m':'')+' em até 3 dias — '+
      'decisão de hoje:</b><ul style="margin:8px 0 0;padding-left:20px">'+
      correndo.map(function(e){
        var d = diasAte(e.encerramento);
        return '<li><b>'+esc(e.orgao||"")+'</b> · '+esc(dinheiro(e.valor))+' · '+
          (d===0?'<b>encerra hoje</b>':d===1?'<b>1 dia</b>':'<b>'+d+' dias</b>')+
          ' ('+esc(br(e.encerramento))+') — '+esc(resumo(e.objeto,110))+
          ' <a href="'+esc(e.link)+'" target="_blank" rel="noopener">abrir</a></li>';
      }).join("")+'</ul></div>';
  }

  corpo += '<div class="hint">O radar guarda <b>só o que ainda dá para disputar</b>. '+
    'Contratação direta já fechada, prazo vencido, processo cancelado e '+
    'inexigibilidade saem na varredura — o certame acabou, e um arquivo de '+
    'disputas terminadas faz o dia parecer cheio quando está vazio. O corte é '+
    'feito depois de a situação ser conferida item a item na fonte, nunca pela '+
    'dedução da coleta: ela já escondeu edital ainda disputável.</div>';

  if(!estado.editais.length){
    corpo += '<div class="card"><div class="vazio"><b>Nenhuma rodada ainda</b>'+
      'A varredura roda todo dia às 02:00. Na primeira execução este painel se enche sozinho.</div></div>';
  } else if(!quentes.length && !mornos.length){
    corpo += '<div class="card"><div class="vazio"><b>Nada quente hoje</b>'+
      'A rodada de '+esc(br(r.data))+' varreu o PNCP inteiro e não achou edital aderente '+
      'com prazo em aberto. É resultado legítimo — e boa parte do que o PNCP publica '+
      'já vem decidida por dispensa: o Arquivo guarda tudo, marcado.</div></div>';
  } else {
    if(quentes.length){
      corpo += '<div class="card"><h3 style="color:var(--quente-i)">Quentes — '+quentes.length+'</h3>'+
        '<p class="small">Aderência direta ao portfólio da Thutor, prazo em aberto e porte compatível com o ticket mínimo.</p>'+
        quentes.map(function(e){ return cartao(e, dbPronto); }).join("")+'</div>';
    }
    if(mornos.length){
      corpo += '<div class="card"><h3 style="color:var(--morno-i)">Mornos — '+mornos.length+'</h3>'+
        '<p class="small">Tema adjacente, porte menor ou escopo ainda impreciso. Vale o olho, não necessariamente a proposta.</p>'+
        mornos.map(function(e){ return cartao(e, dbPronto); }).join("")+'</div>';
    }
  }
  el("p-radar").innerHTML = corpo;
}

/* ---------- PRAZOS ---------- */
function renderPrazos(){
  var lista = estado.editais.filter(function(e){
    var d = diasAte(e.encerramento);
    var st = statusDe(e);
    return disputavel(e) && d!==null && d>=0 && d<=45 && st!=="descartado" && st!=="perdido";
  }).sort(function(a,b){ return diasAte(a.encerramento)-diasAte(b.encerramento); });

  var corpo = '<h2><span class="t">Prazos dos próximos 45 dias</span></h2>'+
    '<div class="hint">A data que importa é o encerramento do prazo de propostas. '+
    'Um edital aderente descoberto tarde demais custa o mesmo que um edital nunca encontrado.</div>';

  if(!lista.length){
    corpo += '<div class="card"><div class="vazio"><b>Nenhum prazo à vista</b>'+
      'Nada em aberto nos próximos 45 dias. Editais sem data de encerramento declarada aparecem no Arquivo.</div></div>';
  } else {
    var faixas = [
      ["Fecha esta semana", function(d){ return d<=7; }],
      ["Duas semanas", function(d){ return d>7 && d<=14; }],
      ["Este mês", function(d){ return d>14 && d<=30; }],
      ["Mais adiante", function(d){ return d>30; }]
    ];
    faixas.forEach(function(f){
      var g = lista.filter(function(e){ return f[1](diasAte(e.encerramento)); });
      if(!g.length) return;
      corpo += '<div class="card"><h3>'+esc(f[0])+' — '+g.length+'</h3>'+
        g.map(function(e){ return cartao(e, dbPronto); }).join("")+'</div>';
    });
  }
  el("p-prazos").innerHTML = corpo;
}

/* ---------- ARQUIVO ---------- */
var filtro = {busca:"", uf:"", frente:"", veredito:"", disputa:"", so_abertos:false};

function renderArquivo(){
  var ufs = {}, lista = estado.editais.slice();
  lista.forEach(function(e){ if(e.uf) ufs[e.uf]=1; });

  function opcoes(mapa, sel, rotulo){
    return '<option value="">'+esc(rotulo)+'</option>'+Object.keys(mapa).sort().map(function(k){
      return '<option value="'+esc(k)+'"'+(sel===k?" selected":"")+'>'+esc(mapa[k]===1?k:mapa[k])+'</option>';
    }).join("");
  }

  var q = filtro.busca.toLowerCase();
  var vis = lista.filter(function(e){
    if(filtro.uf && e.uf!==filtro.uf) return false;
    if(filtro.veredito && e.veredito!==filtro.veredito) return false;
    if(filtro.frente && (e.frentes||[]).indexOf(filtro.frente)<0) return false;
    if(filtro.disputa && disputaDe(e)!==filtro.disputa) return false;
    if(filtro.so_abertos && !aberto(e)) return false;
    if(q){
      var alvo = ((e.objeto||"")+" "+(e.orgao||"")+" "+(e.municipio||"")+" "+(e.justificativa||"")).toLowerCase();
      if(alvo.indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(a,b){ return String(b.publicado_em||"").localeCompare(String(a.publicado_em||"")); });

  var corpo = '<h2><span class="t">Arquivo — tudo que está em disputa</span></h2>'+
    '<div class="filtros">'+
      '<input type="search" id="fBusca" placeholder="Buscar no objeto, órgão ou município" value="'+esc(filtro.busca)+'">'+
      '<select id="fUf">'+opcoes(ufs, filtro.uf, "Todas as UFs")+'</select>'+
      '<select id="fFrente">'+opcoes(FRENTES, filtro.frente, "Todas as frentes")+'</select>'+
      '<select id="fVer">'+opcoes({quente:"Quente",morno:"Morno",frio:"Frio"}, filtro.veredito, "Todos os vereditos")+'</select>'+
      '<select id="fDisp">'+opcoes(DISPUTA, filtro.disputa, "Toda situação")+'</select>'+
      '<button class="btn-ghost btn-sm" id="fAbertos">'+(filtro.so_abertos?"Mostrando só abertos":"Só prazos abertos")+'</button>'+
    '</div>'+
    '<p class="small">'+vis.length+' de '+lista.length+' editais.</p>';

  if(!vis.length){
    corpo += '<div class="card"><div class="vazio"><b>Nada com esses filtros</b>Afrouxe a busca.</div></div>';
  } else {
    corpo += '<div class="card rolagem"><table><thead><tr>'+
      '<th>Publicado</th><th>Órgão</th><th>Objeto</th><th>Frentes</th>'+
      '<th class="num">Valor</th><th>Prazo</th><th></th></tr></thead><tbody>'+
      vis.map(function(e){
        var d = diasAte(e.encerramento);
        return '<tr>'+
          '<td class="num">'+esc(br(e.publicado_em))+'</td>'+
          '<td><b>'+esc((e.orgao||"").slice(0,44))+'</b><br><span class="small">'+esc([e.municipio,e.uf].filter(Boolean).join(" · "))+'</span></td>'+
          '<td style="min-width:280px">'+esc((e.objeto||"").slice(0,190))+((e.objeto||"").length>190?"…":"")+
            '<br><span class="tag '+esc(e.veredito||"frio")+'" style="margin-top:5px">'+esc(e.veredito||"frio")+'</span>'+
            ' <span class="dp '+esc(disputaDe(e))+'">'+esc(rotuloDisputa(e))+'</span>'+
            (e.vencedor && e.vencedor.fornecedor ? '<br><span class="small">contratado: '+esc(e.vencedor.fornecedor)+'</span>' : '')+
            (statusDe(e)!=="novo" ? ' <span class="st '+esc(statusDe(e))+'">'+esc(STATUS[statusDe(e)]||statusDe(e))+'</span>' : '')+'</td>'+
          '<td>'+tagsFrentes(e)+'</td>'+
          '<td class="num">'+esc(dinheiro(e.valor))+'</td>'+
          '<td class="prazo '+classePrazo(d)+'">'+esc(textoPrazo(d))+'</td>'+
          '<td><a href="'+esc(e.link)+'" target="_blank" rel="noopener">abrir</a></td>'+
        '</tr>';
      }).join("")+'</tbody></table></div>';
  }
  el("p-arquivo").innerHTML = corpo;

  el("fBusca").addEventListener("input", function(){ filtro.busca=this.value; var p=this.selectionStart; renderArquivo();
    var n=el("fBusca"); n.focus(); n.setSelectionRange(p,p); });
  el("fUf").addEventListener("change", function(){ filtro.uf=this.value; renderArquivo(); });
  el("fFrente").addEventListener("change", function(){ filtro.frente=this.value; renderArquivo(); });
  el("fVer").addEventListener("change", function(){ filtro.veredito=this.value; renderArquivo(); });
  el("fDisp").addEventListener("change", function(){ filtro.disputa=this.value; renderArquivo(); });
  el("fAbertos").addEventListener("click", function(){ filtro.so_abertos=!filtro.so_abertos; renderArquivo(); });
}

/* ---------- COBERTURA ---------- */
function renderCobertura(){
  var rodadas = estado.rodadas || [];
  var corpo = '<h2><span class="t">Cobertura das rodadas</span></h2>'+
    '<div class="hint">Esta aba existe para que uma varredura que falhou não se pareça com uma '+
    'que deu certo. A rotina só publica depois de passar por <span class="mono">tools/valida_rodada.py</span>, '+
    'que confere se o número de contratações colhidas bate com o que a API do PNCP prometeu entregar.</div>';

  if(!rodadas.length){
    corpo += '<div class="card"><div class="vazio"><b>Nenhuma rodada registrada</b>'+
      'A primeira varredura preenche esta tabela.</div></div>';
  } else {
    corpo += '<div class="card rolagem"><table><thead><tr>'+
      '<th>Data</th><th class="num">PNCP colhidas</th><th class="num">Esperadas</th>'+
      '<th class="num">Candidatos</th><th class="num">Fontes externas</th>'+
      '<th class="num">Triados</th><th class="num">Novos</th><th class="num">Duração</th>'+
      '</tr></thead><tbody>'+
      rodadas.map(function(r){
        var c = r.cobertura||{}, p = c.pncp||{}, x = c.externas||{};
        var dur = "";
        if(c.iniciado_em && c.concluido_em){
          var s = (new Date(c.concluido_em)-new Date(c.iniciado_em))/60000;
          dur = isNaN(s) ? "" : s.toFixed(1)+" min";
        }
        var completo = p.esperados && p.brutos >= p.esperados*0.99;
        return '<tr>'+
          '<td class="num"><b>'+esc(br(r.data))+'</b></td>'+
          '<td class="num"'+(completo?'':' style="color:var(--erro);font-weight:800"')+'>'+esc((p.brutos||0).toLocaleString("pt-BR"))+'</td>'+
          '<td class="num">'+esc((p.esperados||0).toLocaleString("pt-BR"))+'</td>'+
          '<td class="num">'+esc(p.candidatos||0)+'</td>'+
          '<td class="num">'+esc((x.abertas||0)+"/"+(x.tentadas||0))+'</td>'+
          '<td class="num">'+esc(c.triados||0)+'</td>'+
          '<td class="num"><b>'+esc(c.novos||0)+'</b></td>'+
          '<td class="num">'+esc(dur)+'</td>'+
        '</tr>';
      }).join("")+'</tbody></table></div>'+
      '<p class="small">Coluna de colhidas em vermelho significa que a varredura daquele dia ficou incompleta.</p>';
  }
  el("p-cobertura").innerHTML = corpo;
}

/* ---------- ACOMPANHAMENTO ---------- */
/* Aqui havia uma senha, e ela era teatro. O estado inteiro viajava embutido no
   HTML, então quem abria o artifact já tinha status e nota no código-fonte —
   com senha ou sem. O portão impedia edição desatenta, nunca leitura.

   Agora os dois campos vivem no banco do artifact, sob a regra
   {read: "interact", write: "admin"}: quem consegue abrir a página lê, e só
   quem tem permissão de edição escreve. O servidor é que decide, e um campo que
   o viewer não pode ler simplesmente não chega ao navegador dele. */

function docAcomp(id){ return db.doc("acompanhamento/" + id); }

/* Grava com espera: digitar numa nota dispara um evento por tecla, e cada
   escrita é uma chamada de rede. Meio segundo depois da última tecla basta. */
var pendentes = {}, timers = {};
function gravar(id){
  clearTimeout(timers[id]);
  timers[id] = setTimeout(function(){
    var corpo = pendentes[id];
    if(!corpo || !db) return;
    delete pendentes[id];
    corpo.atualizado_em = new Date().toISOString();
    docAcomp(id).set(corpo)["catch"](function(err){
      var c = err && err.code;
      if(c === "invalid_argument"){
        /* É assim que a recusa por permissão chega: sem código próprio, de
           propósito — quem não pode escrever não descobre o que existe. */
        podeEscrever = false; renderAcompanhamento();
        toast("Você tem acesso de leitura neste radar. As marcações não foram salvas.");
      } else if(c === "resource_exhausted"){
        toast("Muitas alterações de uma vez. Espere alguns segundos e tente de novo.");
      } else if(c === "revoked"){
        podeEscrever = false; toast("Seu acesso a este radar mudou. Recarregue a página.");
      } else {
        toast("Não foi possível salvar. Tente de novo em alguns segundos.");
      }
    });
  }, 500);
}

function marcar(id, campo, valor){
  var atual = acomp[id] || {};
  var corpo = pendentes[id] || {status: atual.status || "novo", nota: atual.nota || ""};
  corpo[campo] = valor;
  pendentes[id] = corpo;
  acomp[id] = {status: corpo.status, nota: corpo.nota};  /* eco otimista */
  gravar(id);
}

/* O funil não pode perder a própria história.

   O radar guarda só o que ainda dá para pescar: no dia em que o certame fecha,
   o edital sai da lista. Para o radar isso está certo — mas para o funil é
   amnésia. Um edital marcado "Proposta enviada" sumiria da tela junto com o
   registro de que a Thutor concorreu, e ninguém saberia depois se ganhou,
   perdeu ou nem chegou a saber o resultado.

   A memória (estado.memoria) guarda todo edital que já passou por aqui,
   fechado ou não. O funil traz de volta os que alguém marcou — e só esses:
   trazer a memória inteira encheria o painel de coisa que ninguém tocou. */
function acompanhados(){
  var vistos = {}, lista = [];
  estado.editais.forEach(function(e){ vistos[e.id] = 1; lista.push(e); });
  (estado.memoria || []).forEach(function(m){
    var st = acomp[m.id] && acomp[m.id].status;
    if(vistos[m.id] || !st || st === "novo") return;
    vistos[m.id] = 1;
    var copia = {foraDoRadar: true};
    for(var k in m){ if(Object.prototype.hasOwnProperty.call(m, k)) copia[k] = m[k]; }
    lista.push(copia);
  });
  return lista;
}

function renderAcompanhamento(){
  var alvo = elOpcional("p-acompanhamento");
  if(!alvo) return;   /* versão pública: a aba não existe, e não deve existir */

  if(dbErro){
    alvo.innerHTML = '<h2><span class="t">Acompanhamento comercial</span></h2>'+
      '<div class="card"><div class="vazio"><b>Não foi possível abrir o acompanhamento</b>'+
      esc(dbErro)+'</div></div>';
    return;
  }
  if(!db){
    alvo.innerHTML = '<h2><span class="t">Acompanhamento comercial</span></h2>'+
      '<div class="card"><div class="vazio"><b>Disponível só no artifact</b>'+
      'O estágio de cada edital e as anotações da equipe ficam no banco do artifact, '+
      'que o espelho público não alcança. Abra o radar pelo artifact para trabalhar o funil.</div></div>';
    return;
  }
  if(!dbPronto){
    alvo.innerHTML = '<h2><span class="t">Acompanhamento comercial</span></h2>'+
      '<div class="card"><div class="vazio"><b>Carregando…</b>Buscando as marcações da equipe.</div></div>';
    return;
  }

  var lista = acompanhados().sort(function(a,b){
    var pa = statusDe(a)!=="novo" ? 0 : 1, pb = statusDe(b)!=="novo" ? 0 : 1;
    if(pa!==pb) return pa-pb;
    var fa = a.foraDoRadar ? 1 : 0, fb = b.foraDoRadar ? 1 : 0;
    if(fa!==fb) return fa-fb;
    var da=diasAte(a.encerramento), db_=diasAte(b.encerramento);
    if(da===null) da=9999; if(db_===null) db_=9999;
    return da-db_;
  });

  var porStatus = {};
  lista.forEach(function(e){ var st=statusDe(e); porStatus[st]=(porStatus[st]||0)+1; });

  var corpo = '<h2><span class="t">Acompanhamento comercial</span></h2>'+
    (podeEscrever
      ? '<div class="hint">As marcações salvam sozinhas e aparecem para todo mundo que tem o radar. '+
        'A varredura das 02:00 não alcança este painel — ela reescreve a página, não o banco.</div>'
      : '<div class="warn">Você tem acesso de leitura: dá para acompanhar o funil, não para alterá-lo.</div>')+
    '<div class="qgrid">'+
      Object.keys(STATUS).slice(0,5).map(function(st){
        return '<div class="stat"><b>'+(porStatus[st]||0)+'</b><span>'+esc(STATUS[st])+'</span></div>';
      }).join("")+
    '</div>'+
    '<div class="card">'+
      lista.map(function(e){
        var d = diasAte(e.encerramento), st = statusDe(e);
        return '<div class="edital v-'+esc(e.veredito||"frio")+(d!==null&&d<0?" encerrado":"")+'">'+
          '<div class="ed-orgao">'+esc(e.orgao||"")+' — '+esc([e.municipio,e.uf].filter(Boolean).join(" · "))+'</div>'+
          '<div class="ed-objeto">'+esc(resumo(e.objeto, 240))+'</div>'+
          '<div class="ed-meta" style="margin-bottom:12px">'+
            '<span><b>'+esc(dinheiro(e.valor))+'</b></span>'+
            '<span class="tag '+esc(e.veredito||"frio")+'">'+esc(e.veredito||"frio")+'</span>'+
            '<span class="prazo '+classePrazo(d)+'">'+esc(textoPrazo(d))+'</span>'+
            (e.foraDoRadar ? '<span class="tag frio">fora do radar</span>' : '')+
            (e.link ? '<a href="'+esc(e.link)+'" target="_blank" rel="noopener">abrir edital</a>' : '')+
          '</div>'+
          '<div class="grid2">'+
            '<div class="field"><label for="st-'+esc(e.id)+'">Estágio</label>'+
              '<select id="st-'+esc(e.id)+'" data-id="'+esc(e.id)+'" class="selStatus"'+
                (podeEscrever?'':' disabled')+'>'+
                Object.keys(STATUS).map(function(k){
                  return '<option value="'+k+'"'+(st===k?" selected":"")+'>'+esc(STATUS[k])+'</option>';
                }).join("")+
              '</select></div>'+
            '<div class="field"><label for="nt-'+esc(e.id)+'">Nota interna</label>'+
              '<textarea id="nt-'+esc(e.id)+'" data-id="'+esc(e.id)+'" class="txtNota"'+
                (podeEscrever?'':' readonly')+
                ' placeholder="Quem é o contato, o que falta, por que vale ou não vale">'+
                esc(notaDe(e))+'</textarea></div>'+
          '</div>'+
        '</div>';
      }).join("")+
    '</div>';

  alvo.innerHTML = corpo;
  if(!podeEscrever) return;

  Array.prototype.forEach.call(alvo.querySelectorAll(".selStatus"), function(n){
    n.addEventListener("change", function(){ marcar(this.dataset.id, "status", this.value); });
  });
  Array.prototype.forEach.call(alvo.querySelectorAll(".txtNota"), function(n){
    n.addEventListener("input", function(){ marcar(this.dataset.id, "nota", this.value); });
  });
}

/* Redesenha as abas que mostram estágio quando o banco muda — inclusive por
   escrita de outra pessoa. O painel aberto só se redesenha se ninguém estiver
   digitando nele, senão o cursor pula no meio da frase. */
function aplicarAcomp(){
  if(visivel("p-radar")) renderRadar();
  else if(visivel("p-prazos")) renderPrazos();
  else if(visivel("p-arquivo")) renderArquivo();
  else if(visivel("p-acompanhamento")){
    /* Redesenhar enquanto alguém digita faria o cursor pular no meio da frase. */
    var foco = document.activeElement;
    if(!foco || !foco.classList || !foco.classList.contains("txtNota")) renderAcompanhamento();
  }
}

/* ---------- NAVEGAÇÃO ---------- */
/* Esta lista precisa conter exatamente as abas que existem no HTML. Quando a
   versão pública remove a aba Acompanhamento, tools/build_publico.py também
   remove o nome daqui — se não removesse, el("tab-acompanhamento") viraria
   null, a função estouraria no meio e as outras abas abririam vazias. Foi um
   erro real da Pauta Thutor. */
function irPara(p){
  ["radar","prazos","arquivo","cobertura"].forEach(function(k){
    var b = elOpcional("tab-"+k), painel = elOpcional("p-"+k);
    if(!b || !painel) return;   /* aba removida na versão pública */
    b.setAttribute("aria-selected", String(k===p));
    painel.hidden = (k!==p);
  });
  if(p==="radar") renderRadar();
  if(p==="prazos") renderPrazos();
  if(p==="arquivo") renderArquivo();
  if(p==="cobertura") renderCobertura();
  if(p==="acompanhamento") renderAcompanhamento();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll(".topbar nav button"), function(t){
  t.addEventListener("click", function(){ irPara(t.dataset.p); });
});

/* ---------- PARTIDA ---------- */
/* Não há mais publicação a partir da página. Ela é somente-leitura sobre o
   próprio HTML: quem reescreve o radar é a varredura das 02:00, e o que a
   equipe marca vai para o banco. Um caminho de escrita a menos é um jeito a
   menos de a página se corromper sozinha. */

renderRadar();
el("carimbo").textContent = estado.atualizado_em
  ? "Última rodada " + new Date(estado.atualizado_em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})
  : "Aguardando a primeira rodada";

/* O banco chega depois — nunca na primeira execução deste script, e sem ordem
   garantida em relação ao DOMContentLoaded. Por isso a página já renderiza
   inteira sem ele, e o acompanhamento acende quando (e se) ele responder.
   No espelho público do GitHub Pages não há window.claude, e é exatamente
   assim que deve ser: lá o funil comercial não existe. */
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("db").then(function(d){
    db = d;
    if(!db){ renderAcompanhamentoSeVisivel(); return; }
    db.collection("acompanhamento").onSnapshot(function(snap){
      var mapa = {};
      snap.docs.forEach(function(doc){
        var v = doc.data() || {};
        mapa[doc.id] = {status: v.status || "novo", nota: v.nota || ""};
      });
      acomp = mapa;
      dbPronto = true;
      aplicarAcomp();
    }, function(err){
      var c = err && err.code;
      dbErro = (c === "revoked")
        ? "Seu acesso a este radar mudou enquanto a página estava aberta. Recarregue."
        : "O acompanhamento não pôde ser carregado (" + esc(c || "erro") + ").";
      dbPronto = false;
      renderAcompanhamentoSeVisivel();
    });
  })["catch"](function(){ db = null; renderAcompanhamentoSeVisivel(); });
}

function renderAcompanhamentoSeVisivel(){
  if(visivel("p-acompanhamento")) renderAcompanhamento();
}
})();
</script>
